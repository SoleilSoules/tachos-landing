<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tachos — луч огибает форму (свой шейдер)</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#05060f;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* the obstacle the beam flows around — a stand-in for the hero input */
  .form{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
    width:560px;height:88px;border-radius:28px;background:#fff;z-index:2;
    display:flex;align-items:center;padding:0 22px;color:#8a8a90;font-size:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .form .btn{position:absolute;right:8px;top:8px;bottom:8px;width:96px;border-radius:22px;background:#e0532f}
  .hint{position:absolute;left:24px;bottom:20px;z-index:3;color:#9aa;font-size:13px}
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="form" id="form">Начните описывать задачу<div class="btn"></div></div>
  <div class="hint">свой шейдер · луч падает и огибает форму инпута (Huly Laser, свой код)</div>

<script type="text/plain" id="frag">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uFormC;    // form center in px (y down)
uniform vec2 uFormH;    // form half-size in px
uniform float uFormR;   // corner radius px

float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){ float s=0.0,a=0.5,n=0.0; for(int k=0;k<5;k++){s+=a*vnoise(p);n+=a;p=p*2.0+7.0;a*=0.5;} return s/n; }

// signed distance to a rounded box centred at origin
float sdRoundBox(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return min(max(q.x,q.y),0.0) + length(max(q,0.0)) - r;
}
// outward normal of that rounded box (approx, valid outside)
vec2 boxNormal(vec2 p, vec2 b, float r){
  vec2 q = sign(p) * max(abs(p) - (b - r), 0.0);
  float l = length(q);
  return l > 1e-4 ? q / l : vec2(0.0, -1.0);
}

// Huly-laser palette: deep indigo → violet → white-hot core (blue original)
vec3 ramp(float t){
  vec3 c0 = vec3(0.02,0.03,0.09);
  vec3 c1 = vec3(0.10,0.12,0.42);
  vec3 c2 = vec3(0.30,0.32,0.95);
  vec3 c3 = vec3(0.62,0.66,1.00);
  vec3 c4 = vec3(1.00,1.00,1.00);
  if(t<0.30) return mix(c0,c1,t/0.30);
  if(t<0.62) return mix(c1,c2,(t-0.30)/0.32);
  if(t<0.85) return mix(c2,c3,(t-0.62)/0.23);
  return mix(c3,c4,(t-0.85)/0.15);
}

void main(){
  // work in pixel space, y down (matches DOM form coords)
  vec2 fc = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  float W = uRes.x;

  // form SDF + normal at this pixel
  vec2 rp = fc - uFormC;
  float d = sdRoundBox(rp, uFormH, uFormR);
  vec2 n = boxNormal(rp, uFormH, uFormR);

  // --- the beam: a vertical column that SPLITS into two arms to wrap the form ---
  float cx = W * 0.5;
  float top = uFormC.y - uFormH.y, bot = uFormC.y + uFormH.y;
  // 1 within the form's vertical band (soft lead-in above & below), 0 far away
  float band = smoothstep(top - 150.0, top + 8.0, fc.y) * smoothstep(bot + 150.0, bot - 8.0, fc.y);
  float side = (uFormH.x + 36.0) * band;          // arms bow out to the form's edges
  float wob  = (fbm(vec2(fc.y*0.006 - uTime*0.3, 3.0)) - 0.5) * 30.0;
  float aL = fc.x - (cx - side) + wob;            // left arm
  float aR = fc.x - (cx + side) + wob;            // right arm
  float bxx = abs(aL) < abs(aR) ? aL : aR;        // nearest arm — a single beam when side=0

  float flow = fbm(vec2(bxx*0.010, fc.y*0.004 - uTime*0.55));
  float core = exp(-bxx*bxx * 0.0018);
  float glow = exp(-bxx*bxx * 0.00007);
  float beam = core*1.4 + glow*0.5;
  beam *= 0.55 + 0.75*flow;                        // texture the beam
  beam *= 0.85 + 0.15*sin(uTime*0.6);              // gentle pulse

  // the beam flows around the OUTSIDE of the form, never through it
  float outside = smoothstep(-1.0, 3.0, d);
  beam *= outside;
  // rim glow where an arm grazes the form edge
  float rim = smoothstep(9.0, 0.0, abs(d)) * band * (core*0.7 + 0.3);
  beam += rim * outside;

  float t = clamp(beam, 0.0, 1.0);
  vec3 col = mix(ramp(0.0), ramp(clamp(beam*0.9,0.0,1.0)), clamp(beam,0.0,1.0));
  col += (hash(fc + uTime) - 0.5) * 0.015;         // faint grain
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl');
const vsrc = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;
const fsrc = document.getElementById('frag').textContent;
function compile(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(sh));return sh;}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vsrc));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fsrc));
gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uRes=gl.getUniformLocation(prog,'uRes'),uTime=gl.getUniformLocation(prog,'uTime'),
  uFormC=gl.getUniformLocation(prog,'uFormC'),uFormH=gl.getUniformLocation(prog,'uFormH'),uFormR=gl.getUniformLocation(prog,'uFormR');
const form=document.getElementById('form');
let dpr=1;
function resize(){dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();
const t0=performance.now();
(function loop(){
  const r=form.getBoundingClientRect();
  gl.uniform2f(uRes,cv.width,cv.height);
  gl.uniform2f(uFormC,(r.left+r.width/2)*dpr,(r.top+r.height/2)*dpr);
  gl.uniform2f(uFormH,(r.width/2)*dpr,(r.height/2)*dpr);
  gl.uniform1f(uFormR,28*dpr);
  gl.uniform1f(uTime,(performance.now()-t0)/1000);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
